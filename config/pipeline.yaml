# Pinned execution strategy for KOEXA.
#
# Per PROJECT_MASTER_SPEC.md section 0/9/29: reuse established, pinned tools
# instead of ad hoc scripting where practical. Versions below must be bumped
# deliberately (new pipeline_version, section 36) rather than silently
# floating to "latest" on every run.

pipeline_version: "0.2.0"

# Acquisition + QC + quantification moved off this machine entirely as of
# 2026-09-21 -- see docs/decisions/0004-colab-based-acquisition.md. This
# machine's home internet is too slow against ENA's FTP mirror (~2MB/min,
# confirmed not a Nextflow/Docker/WSL2 issue) to make local downloads
# practical; Google Colab's network is dramatically faster for the same
# transfer. The actual pipeline definition now lives in
# workflows/colab_pantranscriptome.ipynb, run manually in a Colab notebook,
# with only the finished per-sample results (FastQC, quant.sf, gene-level
# TSV -- never raw FASTQ) synced back via Google Drive for ingestion here.
#
# nf-core/fetchngs and nf-core/rnaseq (via Nextflow + Docker Desktop + WSL2,
# see docs/decisions/0003-execution-strategy.md) are no longer in the
# critical path for new samples. The Colab notebook calls the same
# underlying tools directly instead (wget against ENA, fastqc, fastp,
# salmon quant against the same decoy-aware RIB40_v1 index) rather than
# reimplementing Nextflow/conda inside Colab's ephemeral runtime. This
# section is kept for historical reference and in case local Nextflow
# execution needs revisiting.
nf_core_fetchngs_historical:
  revision: "1.12.0"              # "Titanium Platypus", released 2024-02-29
  repository: "https://github.com/nf-core/fetchngs"
  used_for: "DRR786485 only (Milestone 5, 2026-09-20), before the Colab pivot"

nf_core_rnaseq_historical:
  revision: "3.26.0"              # "Chromium Cuttlefish", released 2024-05-07
  repository: "https://github.com/nf-core/rnaseq"
  used_for: "DRR786485 only (Milestone 5, 2026-09-20), before the Colab pivot"

quantification:
  primary_route: "salmon"          # unchanged by the Colab pivot -- see spec section 9
  secondary_route_star: false      # only enabled explicitly for JBrowse/coverage needs (section 9)

notes: >
  Do not silently change the quantification tool (currently Salmon,
  decoy-aware index) or reference without a deliberate, documented decision
  (a new ADR under docs/decisions/ and a bumped pipeline_version) -- mixing
  quantifiers across samples in the same atlas is a real methodological
  problem, not just a config detail.
