# Pinned execution strategy for AOED.
#
# Per PROJECT_MASTER_SPEC.md section 0/9/29: reuse established, pinned
# community pipelines instead of a bespoke downloader/aligner. Versions below
# were the latest published stable releases as of 2026-09-20 and must be
# bumped deliberately (new pipeline_version, section 36) rather than silently
# floating to "latest" on every run.

pipeline_version: "0.1.0"

nextflow:
  min_version: "26.04.4"          # latest stable Nextflow release verified 2026-09-20
  # Nextflow 26.x made the new "strict" config parser the default, which
  # rejects the `def check_max(obj, type) { ... }` Groovy closure pattern
  # nearly every nf-core pipeline's base.config still uses (confirmed
  # 2026-09-20 against nf-core/fetchngs 1.12.0: "Unexpected input: '('" /
  # ConfigParseException). Until nf-core pipelines migrate to the new
  # config DSL, invoke nf-core pipelines with this older, compatible
  # Nextflow release pinned via the NXF_VER env var (Nextflow's launcher
  # downloads it on demand; no separate install needed):
  pinned_nf_core_run_version: "25.10.0"
  resume_enabled: true

nf_core_fetchngs:
  revision: "1.12.0"              # "Titanium Platypus", released 2024-02-29
  repository: "https://github.com/nf-core/fetchngs"
  purpose: "accession resolution, FASTQ acquisition, checksum validation"

nf_core_rnaseq:
  revision: "3.26.0"              # "Chromium Cuttlefish", released 2024-05-07
  repository: "https://github.com/nf-core/rnaseq"
  purpose: "technical QC, library validation, Salmon quantification"
  aligner: "salmon"                # avoid retaining BAM by default; see spec section 9

execution:
  # Decided 2026-09-20 (see docs/decisions/0003-execution-strategy.md): the
  # user's Windows workstation already has a working Docker Desktop install.
  # Nextflow itself still requires a POSIX/WSL environment (there is no
  # native Windows execution path), so Nextflow runs inside a WSL2 Ubuntu
  # distro, which calls out to the existing Docker Desktop engine (WSL2
  # backend) for every process's Linux container. This avoids introducing a
  # new virtualization stack beyond what Docker Desktop already set up.
  profile: "docker"
  container_engine: "docker_desktop_wsl2"
  runs_inside: "wsl2_ubuntu"        # where the `nextflow`/`atlas` commands themselves execute
  max_parallel_samples: 1

quantification:
  primary_route: "salmon"
  secondary_route_star: false      # only enabled explicitly for JBrowse/coverage needs (section 9)

notes: >
  Do not silently upgrade nf-core revisions. A resumed execution must use the
  same pinned inputs, parameters, code revision, and reference (spec section 9),
  or explicitly start a new versioned pipeline_version.
