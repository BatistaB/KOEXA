# Storage Guardian configuration.
# See PROJECT_MASTER_SPEC.md section 5. These limits assume a "modest personal
# computer" per section 0 priorities; tune per machine but never remove the
# safety margins without deliberate review.

storage:
  scratch_max_gb: 30
  minimum_free_gb: 20
  max_parallel_samples: 1

cleanup:
  delete_sra_after_fastq_validation: true
  delete_fastq_after_quant_validation: true
  delete_intermediates_after_success: true
  keep_failed_sample_raw_temporarily: true
  keep_quantification: true
  keep_qc: true
  keep_logs: true

paths:
  scratch_dir: "scratch"
  # Historical (2026-09-20, Milestone 5's first sample only): local Nextflow
  # runs had to use a WSL2-native path here, never /mnt/d/..., because of a
  # 9p/DrvFs-bridge-adjacent corruption bug that turned out to actually be
  # the Windows C: drive filling to 0 bytes free (WSL2's ext4.vhdx lived on
  # C: by default). As of 2026-09-21 (docs/decisions/0004) acquisition and
  # quantification no longer run locally at all -- see
  # workflows/colab_pantranscriptome.ipynb -- so this path is unused unless
  # local Nextflow execution is deliberately revisited.
  nextflow_work_dir: "~/aoed-scratch/nextflow-work"  # historical, not currently used
  results_dir: "results"
  database_path: "database/atlas.duckdb"
