# Storage Guardian configuration.
# See PROJECT_MASTER_SPEC.md section 5. These limits assume a "modest personal
# computer" per section 0 priorities; tune per machine but never remove the
# safety margins without deliberate review.

storage:
  scratch_max_gb: 30
  minimum_free_gb: 20
  max_parallel_samples: 1

cleanup:
  delete_sra_after_fastq_validation: true
  delete_fastq_after_quant_validation: true
  delete_intermediates_after_success: true
  keep_failed_sample_raw_temporarily: true
  keep_quantification: true
  keep_qc: true
  keep_logs: true

paths:
  scratch_dir: "scratch"
  # NOT scratch/nextflow-work (a path under the Windows-mounted D: drive,
  # reached from WSL2 via the 9p/DrvFs bridge). Confirmed 2026-09-20: a
  # large FASTQ downloaded via nf-core/fetchngs through that bridge came
  # out gzip-corrupt (CRC/length errors) on two separate attempts, while
  # the same download succeeded once Nextflow's work dir and the pipeline
  # --outdir were moved to a WSL2-native path. Large sequential binary
  # writes from a Docker container, through WSL2, to a Windows-mounted
  # drive are not reliable enough for raw sequencing data -- always run
  # Nextflow with -work-dir (and --outdir, for fetchngs) pointed at a
  # native Linux path such as ~/aoed-scratch/, never at /mnt/d/...
  nextflow_work_dir: "~/aoed-scratch/nextflow-work"  # WSL2-native path, not under the repo
  results_dir: "results"
  database_path: "database/atlas.duckdb"
